name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Une seule exécution par branche : un nouveau push annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Dépendances (versions verrouillées, wheels uniquement)
        run: pip install --only-binary :all: -r requirements.lock

      - name: L'API démarre sans base, sans modèles et sans clé
        run: python -c "import api.main; print('api.main importé')"

      # Sans MongoDB ni modèles entraînés (non versionnés), les tests d'intégration sont
      # ignorés automatiquement (fixture mongo_available) : seuls les tests unitaires tournent.
      - name: Tests
        env:
          MONGO_URI: "mongodb://localhost:1/?serverSelectionTimeoutMS=500"
        run: python -m pytest tests -q -rs

  frontend:
    name: Frontend (build Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build de production
        run: npm run build -- --configuration production

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images
        run: docker compose build
